<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>QR — Canton Scout</title>
<style>
  body{margin:0;background:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;
    font:15px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif;color:#0b1220}
  .cartao{text-align:center;padding:34px 30px}
  h1{font-size:21px;margin:0 0 4px}
  p{margin:0 0 22px;color:#475569;font-size:13.5px}
  #qr{display:inline-block;padding:16px;border:2px solid #0b1220;border-radius:14px}
  .url{margin-top:20px;font-family:ui-monospace,Menlo,monospace;font-size:14px;
    background:#f1f5f9;padding:9px 14px;border-radius:8px;display:inline-block}
</style>
</head>
<body>
  <div class="cartao">
    <h1>Canton Scout</h1>
    <p>Aponte a câmera do celular para o código</p>
    <div id="qr"></div>
    <div class="url">leoheusi1803-ai.github.io/canton-scout</div>
  </div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  new QRCode(document.getElementById('qr'), {
    text: 'https://leoheusi1803-ai.github.io/canton-scout/',
    width: 320, height: 320,
    colorDark: '#0b1220', colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.M
  });
</script>
</body>
</html>
